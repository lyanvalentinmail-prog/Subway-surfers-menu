name: UI Smoke Test

# Manual on purpose: it boots a full Android emulator (slow), installs the APK and
# checks that the embedded menu screen really runs.
#
#   - Actions tab  -> "UI Smoke Test" -> Run workflow
#   - or push a commit whose message contains [ui-smoke]
on:
  push:
  workflow_dispatch:
    inputs:
      api_level:
        description: "Emulator API level"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: ui-smoke
  cancel-in-progress: true

jobs:
  emulator:
    name: Boot emulator and exercise the app
    # Only run when explicitly requested, so normal pushes stay fast.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[ui-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon --console=plain assembleDebug

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '30' }}
          arch: x86_64
          profile: pixel_5
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p out
            LOG=out/emulator.log
            : > "$LOG"
            run() {
              echo "\$ $*" >> "$LOG"
              "$@" >> "$LOG" 2>&1
              echo "exit=$?" >> "$LOG"
            }

            echo "== devices ==" >> "$LOG"
            adb devices >> "$LOG" 2>&1
            echo "== kvm ==" >> "$LOG"
            ls -l /dev/kvm >> "$LOG" 2>&1

            run adb wait-for-device
            run adb shell settings put global window_animation_scale 0
            run adb install -r app/build/outputs/apk/debug/app-debug.apk
            run adb shell appops set com.submenus.overlay SYSTEM_ALERT_WINDOW allow
            run adb shell pm grant com.submenus.overlay android.permission.POST_NOTIFICATIONS

            run adb shell am start -W -n com.submenus.overlay/.MainActivity
            sleep 4
            run adb shell screencap -p /sdcard/01-launcher.png
            run adb pull /sdcard/01-launcher.png out/01-launcher.png

            run adb shell am start -W -n com.submenus.overlay/.sandbox.SandboxActivity
            sleep 6
            run adb shell input tap 540 1400
            sleep 2
            run adb shell input tap 540 1400
            sleep 2
            run adb shell screencap -p /sdcard/02-sandbox.png
            run adb pull /sdcard/02-sandbox.png out/02-sandbox.png

            run adb shell am start-foreground-service -n com.submenus.overlay/.OverlayService -a com.submenus.overlay.action.START
            sleep 5
            run adb shell screencap -p /sdcard/03-overlay.png
            run adb pull /sdcard/03-overlay.png out/03-overlay.png

            echo "== focus ==" >> "$LOG"
            adb shell dumpsys window windows >> "$LOG" 2>&1
            echo "== logcat ==" >> "$LOG"
            adb logcat -d >> "$LOG" 2>&1

            tail -n 40 "$LOG"
            exit 0

      - name: Check for crashes and report
        if: always()
        run: |
          if [ -f out/emulator.log ]; then
            grep -E "^exit=[1-9]|^\$ |ERROR|error:|Exception|FATAL|installed|Success|Error" out/emulator.log \
              | head -n 60 \
              | while IFS= read -r line; do echo "::notice::${line:0:900}"; done
          else
            echo "::warning::No emulator log produced"
          fi
          CRASHES="$(grep -c "FATAL EXCEPTION" out/logcat.txt 2>/dev/null || echo 0)"
          SANDBOX="$(grep -c "sandbox.SandboxActivity" out/activities.txt 2>/dev/null || echo 0)"
          OVERLAY="$(grep -c "OverlayService" out/logcat.txt 2>/dev/null || echo 0)"
          {
            echo "### UI smoke test"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Fatal exceptions in logcat | ${CRASHES} |"
            echo "| SandboxActivity seen by ActivityManager | ${SANDBOX} |"
            echo "| OverlayService mentions in logcat | ${OVERLAY} |"
            echo ""
            echo "Screenshots and logs are attached to this run as artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRASHES" != "0" ]; then
            grep -A 25 "FATAL EXCEPTION" out/logcat.txt | head -n 60 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi
          echo "::notice::No fatal exceptions; sandbox refs=${SANDBOX}; overlay refs=${OVERLAY}"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: out/
          if-no-files-found: warn
