name: UI Smoke Test

# Manual on purpose: it boots a full Android emulator (slow), installs the APK and
# checks that the embedded menu screen really runs. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "Emulator API level"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: ui-smoke
  cancel-in-progress: true

jobs:
  emulator:
    name: Boot emulator and exercise the app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon --console=plain assembleDebug

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '30' }}
          arch: x86_64
          profile: pixel_5
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -x
            mkdir -p out
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            # Pre-grant the overlay permission (equivalent to the user toggling it)
            adb shell appops set com.submenus.overlay SYSTEM_ALERT_WINDOW allow
            adb shell pm grant com.submenus.overlay android.permission.POST_NOTIFICATIONS || true

            # 1) Launcher screen
            adb shell am start -W -n com.submenus.overlay/.MainActivity
            sleep 4
            adb shell screencap -p /sdcard/01-launcher.png
            adb pull /sdcard/01-launcher.png out/ || true

            # 2) Embedded menu + playable sandbox
            adb shell am start -W -n com.submenus.overlay/.sandbox.SandboxActivity
            sleep 6
            adb shell input tap 540 1400
            sleep 2
            adb shell input tap 540 1400
            sleep 2
            adb shell screencap -p /sdcard/02-sandbox.png
            adb pull /sdcard/02-sandbox.png out/ || true

            # 3) Floating overlay service (same menu, over other apps)
            adb shell am start-foreground-service -n com.submenus.overlay/.OverlayService \
              -a com.submenus.overlay.action.START || true
            sleep 5
            adb shell screencap -p /sdcard/03-overlay.png
            adb pull /sdcard/03-overlay.png out/ || true

            adb logcat -d > out/logcat.txt
            adb shell dumpsys activity activities > out/activities.txt
            adb shell dumpsys window windows > out/windows.txt || true

      - name: Check for crashes and report
        if: always()
        run: |
          CRASHES="$(grep -c "FATAL EXCEPTION" out/logcat.txt 2>/dev/null || echo 0)"
          SANDBOX="$(grep -c "sandbox.SandboxActivity" out/activities.txt 2>/dev/null || echo 0)"
          OVERLAY="$(grep -c "OverlayService" out/logcat.txt 2>/dev/null || echo 0)"
          {
            echo "### UI smoke test"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Fatal exceptions in logcat | ${CRASHES} |"
            echo "| SandboxActivity seen by ActivityManager | ${SANDBOX} |"
            echo "| OverlayService mentions in logcat | ${OVERLAY} |"
            echo ""
            echo "Screenshots and logs are attached to this run as artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRASHES" != "0" ]; then
            grep -A 25 "FATAL EXCEPTION" out/logcat.txt | head -n 60 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi
          echo "::notice::No fatal exceptions; sandbox refs=${SANDBOX}; overlay refs=${OVERLAY}"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: out/
          if-no-files-found: warn
